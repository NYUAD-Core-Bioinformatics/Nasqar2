user  nginx;
worker_processes 1;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500M;

    upstream deseq2shiny {
        server localhost:4001;
    }

    upstream ATACseqQCShniy {
        server localhost:4002;
    }

    upstream ClusterProfShinyGSEA {
        server localhost:4003;
    }

    upstream ClusterProfShinyORA {
        server localhost:4004;
    }

    upstream GeneCountMerger {
        server localhost:4005;
    }

    upstream SeuratV5Shiny {
        server localhost:4006;
    }

    upstream animalcules {
        server localhost:4007;
    }

    upstream DADA2Shiny {
        server localhost:4008;
    }

    upstream monocle3 {
        server localhost:4009;
    }

    upstream DEBrowser {
        server localhost:4010;
    }

    upstream mergeFPKMs {
        server localhost:4011;
    }

    upstream tsar_nasqar {
        server localhost:4012;
    }



    server {
        listen 80;

        # Handle missing source map files (suppress 404 errors)
        location ~* ^/deseq2shiny/.*\.map$ {
            access_log off;
            log_not_found off;
            return 204;  # No Content - silently ignore
        }

        location /deseq2shiny/ {
            proxy_pass http://deseq2shiny/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /deseq2shiny/;
            
            # Critical headers for Shiny subpath support
            proxy_set_header X-Shiny-Server-Base-Path /deseq2shiny;
            proxy_set_header X-Shiny-Server-Protocol-Version 1;
            
            # Prevent buffering for WebSocket
            proxy_buffering off;
            proxy_cache off;
            
            # Increase timeout for long-running operations
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Handle missing source map files for ATACseqQCShniy
        location ~* ^/ATACseqQCShniy/.*\.map$ {
            access_log off;
            log_not_found off;
