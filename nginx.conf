user  nginx;
worker_processes 1;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500M;

    # Allow long URLs (e.g. countsdata query param) - default can be 4k
    large_client_header_buffers 4 32k;

    upstream deseq2shiny {
        server localhost:4001;
    }

    upstream ATACseqQCShniy {
        server localhost:4002;
    }

    upstream ClusterProfShinyGSEA {
        server localhost:4003;
    }

    upstream ClusterProfShinyORA {
        server localhost:4004;
    }

    upstream GeneCountMerger {
        server localhost:4005;
    }

    upstream SeuratV5Shiny {
        server localhost:4006;
    }

    upstream animalcules {
        server localhost:4007;
    }

    upstream DADA2Shiny {
        server localhost:4008;
    }

    upstream monocle3 {
        server localhost:4009;
    }

    upstream DEBrowser {
        server localhost:4010;
    }

    upstream mergeFPKMs {
        server localhost:4011;
    }

    upstream tsar_nasqar {
        server localhost:4012;
    }

    upstream VariantAnnotationShiny {
        server localhost:4013;
    }



    server {
        listen 80;
        
        # Root directory for static files
        root /usr/share/nginx/html;
        index index.html;

        # Serve static files and handle Next.js routing
        # Minified libraries whose package ships no source map (pickr, numbro):
        # a valid empty map keeps browser consoles quiet.
        location @empty_source_map {
            default_type application/json;
            return 200 '{"version":3,"sources":[],"mappings":""}';
        }

        location / {
            # Revalidate documentation pages after each NASQAR2 deployment.
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri.html $uri/ /index.html;
        }

        # Handle missing source map files (suppress 404 errors)
        location ~* ^/deseq2shiny/(.*\.map)$ {
            access_log off;
            proxy_pass http://deseq2shiny/$1;
            proxy_intercept_errors on;
            error_page 404 = @empty_source_map;
        }

        location /deseq2shiny/ {
            proxy_pass http://deseq2shiny/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect / /deseq2shiny/;
            
            # Critical headers for Shiny subpath support
            proxy_set_header X-Shiny-Server-Base-Path /deseq2shiny;
            proxy_set_header X-Shiny-Server-Protocol-Version 1;
            
            # Prevent buffering for WebSocket
            proxy_buffering off;
            proxy_cache off;
            
            # Increase timeout for long-running operations
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Handle missing source map files for ATACseqQCShniy
        location ~* ^/ATACseqQCShniy/(.*\.map)$ {
