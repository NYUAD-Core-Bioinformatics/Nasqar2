version: "3.7"

services:

  nasqar:
    image: nyuadcorebio/nasqarall:latest
    environment:
      NASQAR_EXCHANGE_DIR: /runtime/exchange
    volumes:
      - ${NASQAR_EXCHANGE_HOST_DIR:-/data/nasqar_swarm/exchange}:/runtime/exchange
    networks:
      - net
    deploy:
      replicas: 9
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"

        # Tell Traefik which overlay network to reach this service on
        - "traefik.docker.network=net"

        # Router: match your domain
        - "traefik.http.routers.nasqar.rule=Host(`nasqar2.abudhabi.nyu.edu`)"
        - "traefik.http.routers.nasqar.entrypoints=websecure"
        - "traefik.http.routers.nasqar.tls=true"

        # Service: the port inside the container
        - "traefik.http.services.nasqar.loadbalancer.server.port=80"

        # Sticky sessions (Shiny benefits from this)
        - "traefik.http.services.nasqar.loadbalancer.sticky.cookie=true"

  traefik:
    image: traefik:v2.10
    command:
      # Dashboard (remove api.insecure in prod and protect the dashboard instead)
      - "--api.dashboard=true"
      - "--api.insecure=true"

      # Docker (Swarm) provider
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"

      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Dynamic config (TLS certs + HTTP->HTTPS redirect)
      - "--providers.file.filename=/etc/traefik/dynamic/certs.yml"

    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount the dynamic file exactly where the CLI points
      - /data/nasqar_swarm/certs.yml:/etc/traefik/dynamic/certs.yml:ro
      # Mount the folder that contains your cert and key
      - /data/nasqar_swarm/certs:/certs:ro
    deploy:
      placement:
        constraints: [ "node.role == manager" ]
    networks:
      - net

networks:
  net:
    driver: overlay
